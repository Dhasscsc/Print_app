function decodeB64Utf8(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

const loaded = { print:false, pvc:false, passport:false, compress:false };

function showTab(name){
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+name).classList.add('active');
  document.querySelectorAll('.tabcontent').forEach(c=>c.classList.add('hidden'));
  document.getElementById('tab-'+name).classList.remove('hidden');
  if(!loaded[name]){
    document.getElementById('frame-'+name).srcdoc = decodeB64Utf8(B64_DATA[name]);
    loaded[name] = true;
  }
}

showTab('print');
